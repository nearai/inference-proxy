[advisories]
version = 2
ignore = [
    # paste is unmaintained but is a transitive dep from alloy-primitives;
    # no action we can take until alloy migrates away from it
    "RUSTSEC-2024-0436",
    # derivative is unmaintained (informational only, not a vulnerability);
    # transitive via ark-ff (arkworks). No action available until ark-ff
    # migrates off it. Advisory entered the DB 2026-06-06.
    "RUSTSEC-2024-0388",
    # proc-macro-error2 unmaintained (informational only, not a vulnerability);
    # transitive build-dep, no action available until upstreams migrate off it.
    # Same advisory cloud-api ignored in nearai/cloud-api#733.
    "RUSTSEC-2026-0173",
    # crypto-bigint 0.5.5 timing variability (patched only in >=0.7.6). It is
    # pulled in solely by elliptic-curve 0.13 -> k256/ecdsa 0.13/0.16, used by
    # alloy (via dstack-sdk) and by our own k256 ECDH in src/encryption.rs. The
    # fix needs the RustCrypto elliptic-curve 0.14 generation, which k256 and
    # alloy have not released stable (latest alloy still uses k256 0.13). The
    # path IS reachable (ECDH with the server key), so this is a tracked
    # accepted risk, not a non-reachability claim: the leak needs a local
    # timing/microarchitectural observer on the TEE host. Remove once k256 0.14
    # lands and alloy/dstack-sdk move to it.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # NVIDIA's attestation SDK Rust bindings (libnvat FFI). Not yet on
    # crates.io; pinned to release tag 2026.04.29 in Cargo.toml. Optional
    # `nv-attestation-sdk` feature only — default builds don't pull this.
    "https://github.com/NVIDIA/attestation-sdk.git",
    # Usage envelope and payload shared with the SQS consumer (`usage_report`).
    "https://github.com/nearai/cloud-platform-events",
]
