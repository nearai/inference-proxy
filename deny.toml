[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0441", reason = "pin-utils is an unmaintained transitive dependency of the AWS signing SDK, not a vulnerability advisory. The latest AWS versions compatible with the pinned Rust 1.93 builder still depend on it; remove this exception when the SDK can be upgraded with the builder." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    # NVIDIA's attestation SDK Rust bindings (libnvat FFI). Not yet on
    # crates.io; pinned to release tag 2026.04.29 in Cargo.toml. Optional
    # `nv-attestation-sdk` feature only — default builds don't pull this.
    "https://github.com/NVIDIA/attestation-sdk.git",
    # Usage envelope and payload shared with the SQS consumer (`usage_report`).
    "https://github.com/nearai/cloud-platform-events",
]
