[advisories]
version = 2
ignore = [
    # paste is unmaintained but is a transitive dep from alloy-primitives;
    # no action we can take until alloy migrates away from it
    "RUSTSEC-2024-0436",
    # hickory-proto 0.25 has a DoS via O(n^2) name compression while ENCODING
    # DNS messages — only relevant when acting as a DNS server. Pulled in
    # transitively by dstack-sdk → reqwest [hickory-dns] → hickory-resolver
    # 0.25 → hickory-proto 0.25; reqwest only uses hickory as an async
    # *client* resolver. No safe in-tree upgrade exists (hickory-resolver
    # 0.25 pins hickory-proto ^0.25; bumping requires a newer reqwest, which
    # in turn requires upstream dstack-sdk to publish a new version). Revisit
    # when dstack-sdk drops the `hickory-dns` reqwest feature or bumps
    # reqwest past the hickory 0.26 cutoff.
    "RUSTSEC-2026-0119",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
private = { ignore = true }

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
